name: Update apartment prices
on:
  workflow_dispatch:
# NAS가 정기 수집을 담당한다. 이 워크플로는 수동 진단용으로만 유지한다.
permissions:
  contents: read
concurrency:
  group: apartment-diagnostics
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: Verify MOLIT_API_KEY secret
        shell: bash
        run: |
          if [ -z "$MOLIT_API_KEY" ]; then
            echo "MOLIT_API_KEY is missing. Add it under repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "MOLIT_API_KEY is configured (${#MOLIT_API_KEY} characters)."
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
      - name: Collect apartment trades
        shell: bash
        run: |
          set +e
          python -m collector.main 2> docs/data/last-error.txt
          status=$?
          if [ "$status" -eq 0 ]; then
            rm -f docs/data/last-error.txt
          fi
          exit "$status"
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          GITHUB_BRANCH: ${{ github.ref_name }}
      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apartment-diagnostics
          path: |
            docs/data/latest.json
            docs/data/history.json
            docs/data/last-error.txt
          retention-days: 7
