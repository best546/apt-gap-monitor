name: Update apartment prices
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '15 22 * * 0'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: Verify MOLIT_API_KEY secret
        shell: bash
        run: |
          if [ -z "$MOLIT_API_KEY" ]; then
            echo "MOLIT_API_KEY is missing. Add it under repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "MOLIT_API_KEY is configured (${#MOLIT_API_KEY} characters)."
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
      - name: Collect apartment trades
        shell: bash
        run: |
          set +e
          python -m collector.main 2> docs/data/last-error.txt
          status=$?
          if [ "$status" -eq 0 ]; then
            rm -f docs/data/last-error.txt
          fi
          exit "$status"
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
      - name: Commit data
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/data
          git diff --cached --quiet || git commit -m "data: update apartment trades"
          git push
