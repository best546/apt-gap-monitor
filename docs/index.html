<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>갈아타기 스프레드</title>
<style>:root{font-family:Inter,Pretendard,system-ui;color:#18212f;background:#f3f6fa}body{margin:0}.wrap{max-width:1280px;margin:auto;padding:28px}.hero{background:linear-gradient(120deg,#14213d,#2161d1);color:white;padding:28px;border-radius:22px}.hero h1{margin:0 0 8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.card{background:white;border-radius:16px;padding:18px;box-shadow:0 5px 20px #17345c12}.big{font-size:26px;font-weight:800}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}select,input{padding:10px;border:1px solid #d8e0eb;border-radius:10px;background:white}table{width:100%;border-collapse:collapse;background:white;border-radius:16px;overflow:hidden}th,td{padding:12px;text-align:left;border-bottom:1px solid #edf0f4}th{background:#f9fbfd}.good{color:#079455}.bad{color:#d92d20}.muted{color:#667085;font-size:13px}@media(max-width:760px){.stats{grid-template-columns:1fr}table{font-size:13px}.wrap{padding:14px}.hide-sm{display:none}}</style></head><body><main class="wrap"><section class="hero"><h1>갈아타기 스프레드</h1><div id="updated">불러오는 중…</div></section><section class="stats" id="stats"></section><div class="toolbar"><select id="region"><option value="">모든 지역</option></select><input id="search" placeholder="단지 검색"></div><table><thead><tr><th>지역 / 단지</th><th>대표가</th><th>현재 집과 차이</th><th class="hide-sm">최근 거래</th><th>거래수</th></tr></thead><tbody id="rows"></tbody></table><p class="muted">대표가는 최근 6개월의 동일면적 거래 중앙값입니다. 1층·직거래는 중앙값에서 우선 제외합니다. 호가는 config/asking-prices.json에서 수동 관리할 수 있습니다.</p></main>
<script>
const won=v=>v==null?'자료 없음':(v/10000).toFixed(2).replace(/\.00$/,'')+'억'; let data;
async function init(){data=await fetch('./data/latest.json?'+Date.now()).then(r=>r.json()); document.querySelector('#updated').textContent='갱신 '+new Date(data.generated_at).toLocaleString('ko-KR'); const home=data.items.find(x=>x.id===data.reference_id); const valid=data.items.filter(x=>x.id!==data.reference_id&&x.gap_manwon!=null); document.querySelector('#stats').innerHTML=`<div class="card"><div class="muted">현재 집 대표가</div><div class="big">${won(home.representative_manwon)}</div></div><div class="card"><div class="muted">가장 가까운 후보</div><div class="big">${valid.sort((a,b)=>a.gap_manwon-b.gap_manwon)[0]?.name||'-'}</div></div><div class="card"><div class="muted">수집 대상</div><div class="big">${data.items.length}개 단지</div></div>`; [...new Set(data.items.map(x=>x.region))].forEach(x=>region.insertAdjacentHTML('beforeend',`<option>${x}</option>`)); render();}
function render(){const q=search.value.trim(); const r=region.value; rows.innerHTML=data.items.filter(x=>(!r||x.region===r)&&(!q||x.name.includes(q))).map(x=>`<tr><td><b>${x.name}</b><div class="muted">${x.region} · ${x.area}㎡${x.asking_manwon?' · 호가 '+won(x.asking_manwon):''}</div></td><td>${won(x.representative_manwon)}</td><td class="${x.gap_manwon<0?'good':''}">${x.id===data.reference_id?'기준':won(x.gap_manwon)}</td><td class="hide-sm">${x.latest?won(x.latest.price_manwon)+' · '+x.latest.date+' · '+x.latest.floor+'층':'-'}</td><td>${x.count}</td></tr>`).join('')}; region.onchange=render;search.oninput=render;init().catch(e=>updated.textContent='데이터가 아직 없습니다. Actions를 먼저 실행하세요.');
</script></body></html>
