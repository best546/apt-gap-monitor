<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>갈아타기 스프레드</title>
  <style>
:root{font-family:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;color:#242824;background:#f5f5f2;font-synthesis:none}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.35;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #53654e;outline-offset:3px}
.wrap{max-width:1600px;margin:auto;padding:0 40px 28px}.hero{display:flex;align-items:center;justify-content:space-between;min-height:88px;border-bottom:1px solid #ddded6;gap:16px}.hero h1{font-size:23px;letter-spacing:-1px;margin:0;font-weight:750}.hero .status{font-size:11px;color:#74786e;max-width:60%;text-align:right;line-height:1.6}
.stats{display:grid;grid-template-columns:1.2fr 1fr .7fr;border-bottom:1px solid #ddded6;padding:24px 0;margin:0 0 28px;gap:24px}.stats .card{padding:0 24px 0 0;border-right:1px solid #ddded6}.stats .card:last-child{border:0}.muted{font-size:12px;color:#74786e;line-height:1.7}.big{font-size:30px;font-weight:650;letter-spacing:-1px;margin:6px 0;font-variant-numeric:tabular-nums}.stats .card:nth-child(2) .big{font-size:20px;line-height:1.6}
.workspace{display:grid;grid-template-columns:minmax(320px,.85fr) minmax(0,1.5fr);gap:32px;align-items:start}.list-panel{min-width:0}.list-heading{display:flex;align-items:center;justify-content:space-between}.list-heading h2{font-size:17px;margin:0}.subtle{border:1px solid #d9dcd3;border-radius:6px;background:transparent;color:#555e50;padding:9px 12px;min-height:40px}.list-heading .subtle{font-size:11px;border:0;padding-right:0}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 10px}.toolbar input{grid-column:1/-1;grid-row:1}.toolbar #sortOrder{grid-column:1/-1}input,select{border:1px solid #d9dcd3;background:#fff;border-radius:6px;padding:11px 10px;min-width:0;width:100%;font-size:12px;color:#41493b;min-height:42px}#recommendedOnly{font-size:12px;min-height:34px;padding:6px 10px}#recommendedOnly[aria-pressed=true]{background:#e7ebdf;border-color:#6a785c;color:#36452e}.result-meta{font-size:11px;color:#858a7e}#resultCount{margin:14px 0 8px}
#rows{border-top:1px solid #d9dcd3}.candidate{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #e0e2da;background:transparent;padding:18px 12px;color:inherit;border-left:3px solid transparent}.candidate:hover{background:#eceee7}.candidate[aria-pressed=true]{background:#e7ebdf;border-left-color:#556748}.candidate-top,.candidate-bottom{display:flex;justify-content:space-between;gap:12px;align-items:center}.candidate-top b{font-size:14px;line-height:1.6;font-weight:650}.candidate .muted{font-size:11px;margin-top:3px}.candidate-bottom{margin-top:12px;font-size:11px;color:#74786e}.candidate-bottom strong{font-size:16px;font-weight:600;color:#303b2a;margin-left:5px;font-variant-numeric:tabular-nums}.score-badge{font-size:11px;color:#5d6a51;white-space:nowrap}.candidate-note{display:none}.initial-star{font-size:12px;color:#8c753a;white-space:nowrap}
.chart-panel{background:#fff;border:1px solid #e1e3db;border-radius:10px;padding:24px 30px;position:sticky;top:20px;max-height:calc(100dvh - 40px);overflow-y:auto;scrollbar-gutter:stable;min-width:0;scroll-margin-top:20px}.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.nav .subtle{font-size:12px;padding:7px 10px}.mobile-back{display:none}.selected-label{font-size:10px;color:#848b7c;letter-spacing:1px}.chart-head h2{font-size:27px;letter-spacing:-1px;margin:7px 0;line-height:1.35;overflow-wrap:anywhere}.external-links{display:flex;gap:16px;margin:12px 0 22px}.external-links a{font-size:11px;color:#68775c;text-underline-offset:4px}.selection-prices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;border-top:1px solid #e5e7e0;border-bottom:1px solid #e5e7e0;padding:20px 0}.selection-prices strong{display:block;font-size:25px;letter-spacing:-.7px;font-weight:650;color:#2c3427;margin-top:3px}.selection-prices .access{font-size:18px;line-height:1.9;letter-spacing:0}
.score-detail{font-size:12px;color:#74786e;margin-top:16px;line-height:1.8}.score-detail summary{cursor:pointer;color:#525f48}.score-bars{display:grid;gap:6px;margin:12px 0}.score-bars label{display:grid;grid-template-columns:85px 1fr 45px;gap:10px}.score-bars meter{width:100%;accent-color:#596d4e}.controls{margin-top:16px}.segments{display:flex;gap:4px;width:max-content;padding:3px;background:#f0f2eb;border-radius:6px}.segments button{background:none;border:0;border-radius:4px;color:#737d68;font-size:12px;padding:9px 16px;min-height:36px}.segments button[aria-pressed=true]{background:white;color:#293722;box-shadow:0 1px 3px #00000012}.chart-summary{display:flex;gap:36px;margin-top:20px}.chart-summary strong{display:block;font-size:22px;color:#4b603e;font-weight:600;margin-top:3px}.chart-wrap{height:285px;position:relative;margin-top:12px;cursor:crosshair}.chart-wrap svg{width:100%;height:100%;overflow:visible}.axis{stroke:#e5e7e0;stroke-width:1;stroke-dasharray:3 5}.line{fill:none;stroke:#596f49;stroke-width:2.5}.dot{fill:#596f49;stroke:white;stroke-width:2}.dot:hover,.dot:focus{stroke:#b5c2a7;stroke-width:5;outline:none}.chart-label{fill:#8b9184;font-size:11px}.detail{font-size:12px;color:#5e6c52;background:#f4f6f0;border-radius:5px;padding:12px;min-height:40px;line-height:1.7}#coverage{font-size:10px;margin-bottom:0}.empty{display:grid;place-items:center;height:100%;font-size:13px;color:#8b9184;text-align:center}.empty-list{padding:32px 12px;text-align:center;font-size:13px;color:#74786e}.footnote{margin-top:28px;font-size:11px;color:#858a7e;line-height:1.8}.footnote summary{cursor:pointer}.footnote p{max-width:700px}#chartComplex{display:none}.good{color:#4b603e}.bad{color:#a1503a}
@media(min-width:1001px){#rows{max-height:calc(100dvh - 290px);min-height:300px;overflow-y:auto;scrollbar-gutter:stable}.list-panel{position:sticky;top:20px}}
@media(max-width:1000px){.wrap{padding:0 20px 24px;max-width:760px}.hero{min-height:72px}.hero h1{font-size:21px}.stats{gap:16px;padding:20px 0;margin-bottom:24px}.stats .card{padding-right:12px}.big{font-size:25px}.stats .card:nth-child(2) .big{font-size:16px}.workspace{display:block}.chart-panel{display:none;position:fixed;inset:0;z-index:20;max-height:none;border:0;border-radius:0;padding:16px 22px calc(24px + env(safe-area-inset-bottom));scrollbar-gutter:auto;scroll-margin:0}.detail-open .chart-panel{display:block}.detail-open{overflow:hidden}.mobile-back{display:inline-block}.nav{position:sticky;top:-16px;background:white;padding:12px 0;z-index:2;margin-top:-16px;border-bottom:1px solid #eee}.nav .result-meta{margin-left:auto}.chart-head h2{font-size:25px}.chart-wrap{height:280px}.candidate{padding:18px 10px}.toolbar{grid-template-columns:1fr 1fr 1fr}.toolbar #sortOrder{grid-column:auto}.selection-prices strong{font-size:23px}}
@media(max-width:480px){.hero .status{max-width:48%;font-size:10px}.stats{grid-template-columns:1.3fr 1fr;gap:12px}.stats .card:nth-child(2){border:0}.stats .card:last-child{display:none}.stats .card:nth-child(2) .big{font-size:15px}.toolbar{grid-template-columns:1fr 1fr}.toolbar #sortOrder{grid-column:1/-1}.chart-panel{padding-left:18px;padding-right:18px}.selection-prices{gap:8px}.selection-prices strong{font-size:21px}.selection-prices .access{font-size:16px}.chart-summary{gap:24px}.chart-summary strong{font-size:20px}.segments{width:100%}.segments button{flex:1}.nav{gap:8px}.chart-wrap{height:250px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero"><h1>갈아타기 노트<span style="color:#7c896e">.</span></h1><div id="updated" class="status">불러오는 중…</div></section>
  <section class="stats" id="stats"></section>
<div class="workspace"><section class="list-panel" id="listPanel"><div class="list-heading"><h2>관심 아파트</h2><button id="resetFilters" class="subtle">필터 초기화</button></div>  <div class="toolbar"><select id="region" aria-label="지역"><option value="">모든 지역</option></select><input id="search" type="search" aria-label="단지 및 검토 메모 검색" placeholder="단지 검색"><select id="gapFilter" aria-label="가격차 구간"><option value="">모든 가격차</option><option value="near">0~3억</option><option value="mid">3~6억</option><option value="upper">6~9억</option><option value="far">9억 초과</option><option value="lower">우리 집보다 저렴</option><option value="pending">자료 대기</option></select><select id="sortOrder" aria-label="정렬"><option value="score">목표 적합도 높은 순</option><option value="gap">가격차 작은 순</option><option value="price">대표가 낮은 순</option><option value="name">단지명 순</option></select></div>
<button id="recommendedOnly" class="subtle" aria-pressed="false">★ 추천 단지</button><p class="result-meta" id="resultCount" aria-live="polite"></p><div id="rows"></div></section>  <section class="card chart-panel" id="chartPanel" tabindex="-1" aria-label="선택한 아파트 상세">
<div class="nav"><button class="subtle mobile-back" id="backToList">← 목록</button><span id="selectionPosition" class="result-meta"></span><div><button class="subtle" id="prevCandidate" aria-label="이전 아파트">← 이전</button> <button class="subtle" id="nextCandidate" aria-label="다음 아파트">다음 →</button></div></div>
    <div class="chart-head">
      <div class="selected-label">APARTMENT</div><h2 id="selectedName">아파트를 선택하세요</h2><div class="muted" id="selectedMeta"></div><div id="externalLinks" class="external-links"></div><div id="selectionPrices" class="selection-prices"></div><div id="scoreDetail"></div><div style="margin-top:18px;font-weight:700">가격차 추이</div>
      <div class="controls"><select id="chartComplex" aria-label="그래프로 볼 단지"></select><div class="segments" aria-label="표시 기간"><button data-months="6" aria-pressed="false">6개월</button><button data-months="12" aria-pressed="false">1년</button><button data-months="36" aria-pressed="false">3년</button><button data-months="60" aria-pressed="true">5년</button></div></div>
    </div>
    <div id="chartSummary" class="chart-summary"></div><div class="chart-wrap" id="gapChart"></div><div class="detail" id="chartDetail" aria-live="polite">그래프에서 월별 가격 확인</div><p class="muted" id="coverage"></p>
  </section>
</div>
  <details class="footnote"><summary>가격 산정 기준</summary><p>가격차는 매매가 차이이며 취득·매도 비용과 대출 상환액은 포함하지 않습니다. 후보 메모는 비교 관점이며 우열 순위가 아닙니다. 대표가는 최근 6개월 동일면적 거래의 중앙값입니다. 1~3층과 직거래는 대표가 및 그래프에서 제외합니다. 최근 거래 칸에는 필터 여부와 관계없이 가장 최근 신고 건을 표시합니다. 그래프는 양쪽 거래가 있는 월만 표시하며 선은 관측값 사이를 연결합니다.</p></details>
</main>
<script>
const won=v=>v==null?'자료 없음':(v/10000).toFixed(2).replace(/\.00$/,'')+'억';
const updated=document.getElementById('updated'), stats=document.getElementById('stats'), region=document.getElementById('region'), search=document.getElementById('search'), rows=document.getElementById('rows'), chartComplex=document.getElementById('chartComplex'), gapChart=document.getElementById('gapChart'), chartSummary=document.getElementById('chartSummary'), chartDetail=document.getElementById('chartDetail'), coverage=document.getElementById('coverage');
const mi=m=>Number(m.slice(0,4))*12+Number(m.slice(5,7))-1;
const mt=n=>Math.floor(n/12)+'-'+String(n%12+1).padStart(2,'0');
const gapFilter=document.getElementById('gapFilter'),sortOrder=document.getElementById('sortOrder');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gapBucket=x=>x.gap_manwon==null?'pending':x.gap_manwon<0?'lower':x.gap_manwon<=30000?'near':x.gap_manwon<=60000?'mid':x.gap_manwon<=90000?'upper':'far';
const initialRecommendations=new Set(['pangyo5','pangyo3','pangyo9','gwanggyo-central','gwanggyo-nature','sujie편한','seongbok-lotte','jinsan5','seongbok-hyundai','bundang-sangrok','bundang-yangji','imae-beautiful','gwacheon-raemian','dongtan2-ban-do','dongtan2-geo']);
let data,period=60,visibleItems=[],returnId=null,recoveryNotice='',recommendedOnly=false;
const $=id=>document.getElementById(id);
// Explicit comparison heuristic, not a location or investment-return rating.
const strategicProfiles={
  '동판교':{invest:48,school:28,commute:9},'과천':{invest:49,school:29,commute:10},'분당':{invest:47,school:30,commute:10},
  '광교':{invest:46,school:27,commute:15},'서판교':{invest:48,school:27,commute:9},
  '평촌':{invest:44,school:29,commute:9},'수지':{invest:42,school:27,commute:12},
  '죽전':{invest:39,school:25,commute:13},'죽전·보정':{invest:40,school:25,commute:12},
  '의왕':{invest:40,school:24,commute:11},'동탄2':{invest:39,school:21,commute:20},
  '동탄2·호수':{invest:35,school:20,commute:20},'영통·망포':{invest:35,school:23,commute:20},
  '뉴성남 · 신흥역':{invest:46,school:20,commute:8},'뉴성남 · 산성역':{invest:47,school:21,commute:7},
  '뉴성남 · 단대오거리':{invest:42,school:21,commute:8},'기흥역':{invest:35,school:19,commute:17},
  '구성':{invest:35,school:21,commute:15},'동백':{invest:28,school:18,commute:15},
  '동탄1':{invest:30,school:18,commute:20}
};
const strategicAdjustments={
  'gwacheon-raemian':{invest:1},'gwanggyo-jai-class':{invest:2,school:1},'gwanggyo-nature':{school:1},
  'pangyo5':{school:1},'bundang-yangji':{school:1},'sujie편한':{invest:1,school:1},
  'seongbok-lotte':{invest:1},'dongtan2-the-sharp':{invest:2},'dongtan2-lin':{invest:2},
  'seongnam-haneul1':{invest:1,school:1},'seongnam-forestia':{invest:1}
};
function scoreItem(x){
  const base=strategicProfiles[x.region]||{invest:25,school:15,commute:10},adj=strategicAdjustments[x.id]||{};
  const invest=Math.min(50,base.invest+(adj.invest||0)),school=Math.min(30,base.school+(adj.school||0)),commute=Math.min(20,base.commute+(adj.commute||0));
  return {total:invest+school+commute,invest,school,commute};
}
function accessInfo(x){
  const gap=x?.gap_manwon;
  if(!Number.isFinite(gap))return {label:'가격 자료 대기',className:'pending'};
  if(gap<=0)return {label:'여유권',className:'easy'};
  if(gap<=30000)return {label:'현실권',className:'easy'};
  if(gap<=60000)return {label:'도전권',className:'challenge'};
  if(gap<=90000)return {label:'장기권',className:'long'};
  return {label:'점프권',className:'jump'};
}
function updateNavigation(){
  const i=visibleItems.findIndex(x=>x.id===chartComplex.value);
  $('prevCandidate').disabled=i<=0;$('nextCandidate').disabled=i<0||i>=visibleItems.length-1;
  $('selectionPosition').textContent=i<0?'현재 선택은 필터 밖에 있습니다':(i+1)+' / '+visibleItems.length;
}
function selectCandidate(id,move=false){
  chartComplex.value=id;returnId=id;render();renderChart();
  if(move&&matchMedia('(max-width:1000px)').matches){document.body.classList.add('detail-open');$('chartPanel').scrollTop=0;$('chartPanel').focus({preventScroll:true});$('chartPanel').scrollIntoView({behavior:'auto',block:'start'});}
}
function renderSelection(item){
  const query=encodeURIComponent(item?.name||'');
  const source=item?.source_url||'';
  const hogang=/^https:\/\/hogangnono\.com\/apt\/[a-zA-Z0-9]+(?:[/?#]|$)/.test(source)?source:'https://hogangnono.com/search?q='+query;
  $('externalLinks').innerHTML=item?'<a href="'+esc(hogang)+'" target="_blank" rel="noopener noreferrer">호갱노노 ↗</a><a href="https://new.land.naver.com/search?sk='+query+'" target="_blank" rel="noopener noreferrer">네이버부동산 ↗</a>':'';

  $('selectedName').textContent=item?(initialRecommendations.has(item.id)?'★ ':'')+item.name:'아파트를 선택하세요';
  $('selectedMeta').textContent=item?item.region+' · 전용 '+item.area+'㎡ · 대표가 표본 '+item.count+'건':'';
  const access=accessInfo(item);
  $('selectionPrices').innerHTML='<div class="muted">단지 대표가<strong>'+won(item?.representative_manwon)+'</strong></div><div class="muted">우리 집 대비<strong>'+won(item?.gap_manwon)+'</strong></div><div class="muted">접근 가능성<strong class="access '+access.className+'">'+access.label+'</strong></div>';
  const score=item?scoreItem(item):null;
  $('scoreDetail').innerHTML='<details class="score-detail"><summary>목표 적합도 '+(score?score.total+' / 100점':'-')+' ⓘ</summary><p>자산 증식 50 · 학군 30 · 출퇴근 20. 가격은 점수에서 제외합니다.</p>'+(score?'<div class="score-bars">'+[['자산 증식',score.invest,50],['학군 이동',score.school,30],['화성 출퇴근',score.commute,20]].map(([label,v,max])=>'<label>'+label+'<meter min="0" max="'+max+'" value="'+v+'">'+v+'</meter><span>'+v+'/'+max+'</span></label>').join('')+'</div>':'')+'<p>비교용 평가이며 수익을 보장하지 않습니다. 학군 배정·통근시간은 별도 확인이 필요합니다.</p></details>';
  updateNavigation();
}

async function init(){
  data=await fetch('./data/latest.json?'+Date.now()).then(r=>{if(!r.ok)throw new Error('데이터 로드 실패');return r.json()});
  const response=await fetch('./data/watchlist.json?'+Date.now());
  if(!response.ok)throw new Error('후보 설정 로드 실패');
  const watchlist=await response.json();
  const homeConfig=watchlist.complexes.find(x=>x.id===watchlist.reference_id);
  const compatible=d=>{
    const h=d?.items?.find(x=>x.id===watchlist.reference_id);
    return h&&homeConfig&&d.reference_id===watchlist.reference_id&&h.area===homeConfig.area
      &&h.area_tolerance===(homeConfig.area_tolerance??watchlist.area_tolerance)
      &&h.min_floor===(homeConfig.min_floor??watchlist.min_floor??4)
      &&Array.isArray(h.monthly_prices)&&Number.isFinite(h.representative_manwon);
  };
  if(!compatible(data)){
    const backupResponse=await fetch('./data/validated.json?'+Date.now());
    if(!backupResponse.ok)throw new Error('정상 자료 복원 실패');
    const backup=await backupResponse.json();
    if(!compatible(backup))throw new Error('현재 집 설정과 일치하는 정상 자료가 없습니다');
    data=backup;
    recoveryNotice=' · 최신 업로드의 면적·수집 조건이 맞지 않아 마지막 정상 자료를 표시 중입니다. 수집기 업데이트가 필요합니다.';
  }
  watchlist.complexes.filter(x=>x.recommended).forEach(x=>initialRecommendations.add(x.id));
  const old=new Map(data.items.map(x=>[x.id,x]));
  data.items=watchlist.complexes.map(c=>{
    const x=old.get(c.id);
    const changed=x&&(JSON.stringify(x.aliases)!==JSON.stringify(c.aliases)||x.area!==c.area||x.dong!==c.dong||JSON.stringify(x.dong_aliases)!==JSON.stringify(c.dong_aliases)||x.match_mode!==c.match_mode||x.lawd_cd!==c.lawd_cd
      ||x.area_tolerance!==(c.area_tolerance??watchlist.area_tolerance)||x.min_floor!==(c.min_floor??watchlist.min_floor??4));
    return x&&!changed?{...x,...c}:{...c,count:0,representative_manwon:null,gap_manwon:null,latest:null,monthly_gaps:[],pending:true};
  });
  updated.textContent='업데이트 '+new Date(data.generated_at).toLocaleDateString('ko-KR')+recoveryNotice;
  const home=data.items.find(x=>x.id===data.reference_id);
  const valid=data.items.filter(x=>x.id!==data.reference_id&&x.gap_manwon!=null).sort((a,b)=>Math.abs(a.gap_manwon)-Math.abs(b.gap_manwon));
  stats.innerHTML=`<div class="card"><div class="muted">우리 집</div><div class="big">${won(home.representative_manwon)}</div><div class="muted">전용 ${home.area}㎡ · ${home.min_floor||4}층 이상</div><div class="muted">최근 신고 실거래 <b>${won(home.latest?.price_manwon)}</b>${home.latest?' · '+esc(home.latest.date)+' · '+home.latest.floor+'층':''}</div></div><div class="card"><div class="muted">가격차 최소</div><div class="big">${esc(valid[0]?.name||'-')}</div></div><div class="card"><div class="muted">확장 관심 목록</div><div class="big">${data.items.length-1}개 후보</div></div>`;
  [...new Set(data.items.map(x=>x.region))].forEach(x=>region.insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));
  data.items.filter(x=>x.id!==data.reference_id).forEach(x=>chartComplex.insertAdjacentHTML('beforeend',`<option value="${esc(x.id)}">${esc(x.region)} · ${esc(x.name)}</option>`));
  const first=valid.find(x=>x.monthly_gaps?.length);if(first)chartComplex.value=first.id;
  chartComplex.onchange=()=>selectCandidate(chartComplex.value);
  render(); renderChart();
}
function render(){
  if(!data)return;
  const q=search.value.trim().toLowerCase(),r=region.value;
  visibleItems=data.items.filter(x=>x.id!==data.reference_id&&(!recommendedOnly||initialRecommendations.has(x.id))&&(!r||x.region===r)&&(!q||(x.name+' '+x.region+' '+(x.watch_note||'')).toLowerCase().includes(q))&&(!gapFilter.value||gapBucket(x)===gapFilter.value));
  visibleItems.sort((a,b)=>{
    if(sortOrder.value==='name')return a.name.localeCompare(b.name,'ko');
    const value=x=>sortOrder.value==='score'?-(scoreItem(x)?.total??-1):sortOrder.value==='price'?(x.representative_manwon??Infinity):(x.gap_manwon==null?Infinity:Math.abs(x.gap_manwon));
    return value(a)-value(b)||a.name.localeCompare(b.name,'ko');
  });
  $('resultCount').textContent=visibleItems.length+'개 표시 / 전체 '+data.items.filter(x=>x.id!==data.reference_id).length+'개';
  rows.innerHTML=visibleItems.map(x=>{const score=scoreItem(x);return `<button type="button" class="candidate" data-id="${esc(x.id)}" aria-pressed="${x.id===chartComplex.value}" aria-controls="chartPanel"><div class="candidate-top"><b>${esc(x.name)}${initialRecommendations.has(x.id)?' <span class="initial-star" title="추천 단지">★</span>':''}</b><span class="score-badge" title="자산증식 50 · 학군 30 · 출퇴근 20">${score.total+'점'}</span></div><div class="muted">${esc(x.region)} · 전용 ${esc(x.area)}㎡</div><div class="candidate-bottom"><span>대표가 <strong>${won(x.representative_manwon)}</strong></span><span>가격차 <strong>${won(x.gap_manwon)}</strong></span></div><div class="candidate-note">${esc(x.watch_note||'')}${x.pending?' · 새 수집 대기':''}</div></button>`}).join('')||'<div class="empty-list">조건에 맞는 후보가 없습니다.<p class="muted">검색어나 필터를 바꾸거나 초기화해 주세요.</p></div>';
  rows.querySelectorAll('[data-id]').forEach(b=>b.onclick=e=>{const showScore=!!e.target.closest('.score-badge');selectCandidate(b.dataset.id,true);if(showScore)$('scoreDetail').querySelector('details').open=true});
  updateNavigation();
}
function renderChart(){
  if(!data)return;
  const item=data.items.find(x=>x.id===chartComplex.value);
  renderSelection(item);
  const end=mi(data.generated_at.slice(0,7)),start=end-period+1;
  const points=(item?.monthly_gaps||[]).filter(p=>Number.isFinite(p.gap_manwon)&&mi(p.month)>=start&&mi(p.month)<=end).sort((a,b)=>a.month.localeCompare(b.month));
  chartDetail.textContent='그래프에서 월별 가격 확인';
  const available=data.history_months??data.months??6;
  coverage.textContent=mt(start)+' ~ '+mt(end)+' · 비교 가능한 '+points.length+'개 월 · 수집 범위 '+available+'개월'+(available<period?' / 과거 데이터는 확장된 수집기 실행 후 표시됩니다.':'');
  if(!points.length){chartSummary.innerHTML='';gapChart.innerHTML='<div class="empty">이 기간에 비교할 월별 거래가 없습니다.<br>다른 단지나 기간을 선택해 주세요.</div>';if(item?.pending)chartDetail.textContent='새 후보의 거래자료를 수집 중입니다. 수집 후 그래프와 점수가 표시됩니다.';else if(!item?.monthly_gaps)chartDetail.textContent='월별 데이터가 없습니다. 최신 수집기를 실행해 주세요.';return;}
  const first=points[0],last=points.at(-1),change=last.gap_manwon-first.gap_manwon;
  chartSummary.innerHTML='<div class="muted">최근 비교월 가격차 · '+last.month+'<strong>'+won(last.gap_manwon)+'</strong></div><div class="muted">'+first.month+' 대비<strong>'+(points.length<2?'비교 자료 부족':change===0?'변동 없음':won(Math.abs(change))+(change<0?' 축소 ↓':' 확대 ↑'))+'</strong></div>';
  const W=Math.max(280,gapChart.clientWidth),H=gapChart.clientHeight,L=55,R=28,T=25,B=35,innerW=W-L-R,innerH=H-T-B;
  let min=Math.min(...points.map(p=>p.gap_manwon)),max=Math.max(...points.map(p=>p.gap_manwon));
  const pad=Math.max((max-min)*.2,1000);min-=pad;max+=pad;
  const x=m=>L+(mi(m)-start)*innerW/(period-1),y=v=>T+(max-v)*innerH/(max-min);
  const grid=Array.from({length:5},(_,i)=>{const v=max-(max-min)*i/4,yy=y(v);return '<line class="axis" x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'"/><text class="chart-label" x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end">'+won(v)+'</text>'}).join('');
  const count=W<600?4:7;
  const labels=Array.from({length:count},(_,i)=>{const m=mt(Math.round(start+(period-1)*i/(count-1)));return '<text class="chart-label" x="'+x(m)+'" y="'+(H-8)+'" text-anchor="middle">'+m.replace('-','.')+'</text>'}).join('');
  const path=points.map((p,i)=>(i?'L':'M')+x(p.month)+' '+y(p.gap_manwon)).join(' ');
  const marks=points.map((p,i)=>'<circle class="dot" tabindex="0" role="button" aria-label="'+p.month+' 가격차 '+won(p.gap_manwon)+'" data-point="'+i+'" cx="'+x(p.month)+'" cy="'+y(p.gap_manwon)+'" r="'+(points.length>30?3.5:5)+'"><title>'+p.month+': '+won(p.gap_manwon)+'</title></circle>').join('');
  gapChart.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="group" aria-label="현재 집과의 월별 가격차"><defs><linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#23b195" stop-opacity=".22"/><stop offset="1" stop-color="#23b195" stop-opacity="0"/></linearGradient></defs>'+grid+'<path d="'+path+' L'+x(last.month)+' '+(H-B)+' L'+x(first.month)+' '+(H-B)+' Z" fill="url(#shade)"/><path class="line" d="'+path+'"/>'+marks+labels+'</svg>';
  gapChart.querySelector('svg').onclick=e=>{const rect=e.currentTarget.getBoundingClientRect(),px=(e.clientX-rect.left)*W/rect.width;const p=points.reduce((a,b)=>Math.abs(x(a.month)-px)<Math.abs(x(b.month)-px)?a:b);chartDetail.textContent=p.month+' · 목표 '+won(p.target_price_manwon)+' − 우리 집 '+won(p.home_price_manwon)+' = 가격차 '+won(p.gap_manwon)};
  gapChart.querySelectorAll('[data-point]').forEach(el=>{const show=()=>{const p=points[+el.dataset.point];chartDetail.textContent=p.month+' · 목표 '+won(p.target_price_manwon)+' − 우리 집 '+won(p.home_price_manwon)+' = 가격차 '+won(p.gap_manwon)};el.onmouseenter=show;el.onfocus=show;el.onclick=e=>{e.stopPropagation();show()};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show()}}});
}
document.querySelectorAll('[data-months]').forEach(b=>b.onclick=()=>{period=+b.dataset.months;document.querySelectorAll('[data-months]').forEach(a=>a.setAttribute('aria-pressed',a===b?'true':'false'));renderChart()});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(renderChart,100)});
region.onchange=render;search.oninput=render;gapFilter.onchange=render;sortOrder.onchange=render;
$('prevCandidate').onclick=()=>{const i=visibleItems.findIndex(x=>x.id===chartComplex.value);if(i>0)selectCandidate(visibleItems[i-1].id)};
$('nextCandidate').onclick=()=>{const i=visibleItems.findIndex(x=>x.id===chartComplex.value);if(i>=0&&i<visibleItems.length-1)selectCandidate(visibleItems[i+1].id)};
$('backToList').onclick=()=>{document.body.classList.remove('detail-open');const b=[...rows.querySelectorAll('[data-id]')].find(b=>b.dataset.id===returnId);(b||$('listPanel')).scrollIntoView({block:'center',behavior:'auto'});if(b)b.focus({preventScroll:true})};
$('recommendedOnly').onclick=()=>{recommendedOnly=!recommendedOnly;$('recommendedOnly').setAttribute('aria-pressed',String(recommendedOnly));render()};
$('resetFilters').onclick=()=>{recommendedOnly=false;$('recommendedOnly').setAttribute('aria-pressed','false');search.value='';region.value='';gapFilter.value='';sortOrder.value='score';render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('detail-open'))$('backToList').click()});
init().catch(e=>updated.textContent='자료 표시 오류: '+e.message);
</script>
</body>
