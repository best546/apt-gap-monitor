<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>갈아타기 스프레드</title>
  <style>
    :root{font-family:Inter,Pretendard,system-ui;color:#18212f;background:#f3f6fa}body{margin:0}.wrap{max-width:1280px;margin:auto;padding:28px}.hero{background:linear-gradient(120deg,#14213d,#2161d1);color:white;padding:28px;border-radius:22px}.hero h1{margin:0 0 8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.card{background:white;border-radius:16px;padding:18px;box-shadow:0 5px 20px #17345c12}.big{font-size:26px;font-weight:800}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}select,input{padding:10px;border:1px solid #d8e0eb;border-radius:10px;background:white}.chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.chart-wrap{height:300px;position:relative}.chart-wrap svg{width:100%;height:100%;overflow:visible}.axis{stroke:#d8e0eb;stroke-width:1}.line{fill:none;stroke:#2161d1;stroke-width:3}.dot{fill:#2161d1;stroke:white;stroke-width:2}.chart-label{fill:#667085;font-size:12px}.chart-value{fill:#18212f;font-size:12px;font-weight:700}.empty{display:grid;place-items:center;height:100%;color:#667085;text-align:center}table{width:100%;border-collapse:collapse;background:white;border-radius:16px;overflow:hidden}th,td{padding:12px;text-align:left;border-bottom:1px solid #edf0f4}th{background:#f9fbfd}.good{color:#079455}.bad{color:#d92d20}.muted{color:#667085;font-size:13px}@media(max-width:760px){.stats{grid-template-columns:1fr}table{font-size:13px}.wrap{padding:14px}.hide-sm{display:none}.chart-wrap{height:260px}}
  </style>
</head>
<body>
<main class="wrap">
  <section class="hero"><h1>갈아타기 스프레드</h1><div id="updated">불러오는 중…</div></section>
  <section class="stats" id="stats"></section>
  <section class="card">
    <div class="chart-head">
      <div><b>현재 집과의 가격차 추이</b><div class="muted">월별 동일면적 일반거래 중앙값 기준</div></div>
      <select id="chartComplex" aria-label="그래프로 볼 단지"></select>
    </div>
    <div class="chart-wrap" id="gapChart"></div>
  </section>
  <div class="toolbar"><select id="region"><option value="">모든 지역</option></select><input id="search" placeholder="단지 검색"></div>
  <table><thead><tr><th>지역 / 단지</th><th>대표가</th><th>현재 집과 차이</th><th class="hide-sm">최근 거래</th><th>거래수</th></tr></thead><tbody id="rows"></tbody></table>
  <p class="muted">대표가는 최근 6개월 동일면적 거래의 중앙값입니다. 1~3층과 직거래는 대표가 및 그래프에서 제외합니다. 최근 거래 칸에는 필터 여부와 관계없이 가장 최근 신고 건을 표시합니다. 호가는 config/asking-prices.json에서 수동 관리할 수 있습니다.</p>
</main>
<script>
const won=v=>v==null?'자료 없음':(v/10000).toFixed(2).replace(/\.00$/,'')+'억';
let data;
async function init(){
  data=await fetch('./data/latest.json?'+Date.now()).then(r=>r.json());
  updated.textContent='갱신 '+new Date(data.generated_at).toLocaleString('ko-KR');
  const home=data.items.find(x=>x.id===data.reference_id);
  const valid=data.items.filter(x=>x.id!==data.reference_id&&x.gap_manwon!=null).sort((a,b)=>a.gap_manwon-b.gap_manwon);
  stats.innerHTML=`<div class="card"><div class="muted">현재 집 대표가</div><div class="big">${won(home.representative_manwon)}</div><div class="muted">전용 ${home.area}㎡ · ${home.min_floor||4}층 이상</div></div><div class="card"><div class="muted">가장 가까운 후보</div><div class="big">${valid[0]?.name||'-'}</div></div><div class="card"><div class="muted">수집 대상</div><div class="big">${data.items.length}개 단지</div></div>`;
  [...new Set(data.items.map(x=>x.region))].forEach(x=>region.insertAdjacentHTML('beforeend',`<option>${x}</option>`));
  data.items.filter(x=>x.id!==data.reference_id).forEach(x=>chartComplex.insertAdjacentHTML('beforeend',`<option value="${x.id}">${x.region} · ${x.name}</option>`));
  chartComplex.onchange=renderChart;
  render(); renderChart();
}
function render(){
  const q=search.value.trim(), r=region.value;
  rows.innerHTML=data.items.filter(x=>(!r||x.region===r)&&(!q||x.name.includes(q))).map(x=>`<tr><td><b>${x.name}</b><div class="muted">${x.region} · ${x.area}㎡${x.asking_manwon?' · 호가 '+won(x.asking_manwon):''}</div></td><td>${won(x.representative_manwon)}</td><td class="${x.gap_manwon<0?'good':''}">${x.id===data.reference_id?'기준':won(x.gap_manwon)}</td><td class="hide-sm">${x.latest?won(x.latest.price_manwon)+' · '+x.latest.date+' · '+x.latest.floor+'층':'-'}</td><td>${x.count}</td></tr>`).join('');
}
function renderChart(){
  const item=data.items.find(x=>x.id===chartComplex.value) || data.items.find(x=>x.id!==data.reference_id);
  const points=item?.monthly_gaps||[];
  if(!points.length){gapChart.innerHTML='<div class="empty">현재 집과 목표단지가 같은 달에 거래된 기록이 없습니다.<br>다음 수집 때 신고 거래가 늘어나면 자동으로 표시됩니다.</div>';return;}
  const W=900,H=260,L=70,R=30,T=25,B=45,innerW=W-L-R,innerH=H-T-B;
  let min=Math.min(...points.map(p=>p.gap_manwon)),max=Math.max(...points.map(p=>p.gap_manwon));
  const pad=Math.max((max-min)*.15,1000);min-=pad;max+=pad;
  const x=i=>points.length===1?L+innerW/2:L+i*innerW/(points.length-1);
  const y=v=>T+(max-v)*innerH/(max-min);
  const grid=Array.from({length:5},(_,i)=>{const v=max-(max-min)*i/4,yy=y(v);return `<line class="axis" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"/><text class="chart-label" x="${L-10}" y="${yy+4}" text-anchor="end">${won(v)}</text>`}).join('');
  const path=points.map((p,i)=>(i?'L':'M')+x(i)+' '+y(p.gap_manwon)).join(' ');
  const marks=points.map((p,i)=>`<circle class="dot" cx="${x(i)}" cy="${y(p.gap_manwon)}" r="5"><title>${p.month}: ${won(p.gap_manwon)} (목표 ${won(p.target_price_manwon)}, 현재 집 ${won(p.home_price_manwon)})</title></circle><text class="chart-value" x="${x(i)}" y="${y(p.gap_manwon)-11}" text-anchor="middle">${won(p.gap_manwon)}</text><text class="chart-label" x="${x(i)}" y="${H-16}" text-anchor="middle">${p.month.replace('-','.')}</text>`).join('');
  gapChart.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${item.name}과 현재 집의 월별 가격차">${grid}<path class="line" d="${path}"/>${marks}</svg>`;
}
region.onchange=render;search.oninput=render;
init().catch(e=>updated.textContent='데이터가 아직 없습니다. 수집기를 먼저 실행하세요.');
</script>
</body>
</html>
